<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM XSS - Safe</title>
</head>
<body>
    <h1>Education Portal - DOM Test</h1>

    <p>Search term from URL:</p>
    <div id="result"></div>

    <p>
        <a href="/safe">Back to Home</a>
    </p>

    <script>
        const userInput = window.location.hash.substring(1);
        document.getElementById("result").textContent = decodeURIComponent(userInput);
    </script>
</body>
</html>
