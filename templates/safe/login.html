
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safe Login</title>
</head>
<body>
    <h1>Education Portal - Safe Login</h1>

    <form action="/safe/login" method="POST">
        <label>Username:</label>
        <input type="text" name="username" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <p><a href="/safe">Back to Home</a></p>
</body>
</html>
