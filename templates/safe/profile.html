
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safe Student Profile</title>
</head>
<body>
    <h1>Student Profile - Safe Version</h1>

    <p>Current email: {{ student["email"] }}</p>

    <form action="/safe/update-email" method="POST">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label for="email">New email:</label>
        <input type="email" id="email" name="email" required>
        <button type="submit">Update Email</button>
    </form>

    <p><a href="/safe">Back to Home</a></p>
</body>
</html>
